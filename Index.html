<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightyellow;
            padding: 20px;
        }

        form {
            width: 500px;
            margin: auto;
            padding: 25px;
            border: 3px solid orange;
            border-radius: 15px;
            background-color: white;
        }

        h2 {
            text-align: center;
            color: orange;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid gray;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        input[type="color"],
        input[type="range"] {
            width: auto;
        }

        input[type="submit"],
        input[type="reset"] {
            width: 48%;
            margin-top: 20px;
            cursor: pointer;
        }

        input[type="submit"] {
            background-color: orange;
            color: white;
        }

        input[type="reset"] {
            background-color: lightgray;
        }
    </style>
</head>

<body>

<form>

    <h2>Student Registration Form</h2>

    <label>Full Name:</label>
    <input type="text" placeholder="Enter your full name">

    <label>Email:</label>
    <input type="email" placeholder="Enter your email">

    <label>Password:</label>
    <input type="password" placeholder="Enter password">

    <label>Age:</label>
    <input type="number" min="16" max="100">

    <label>Date of Birth:</label>
    <input type="date">

    <label>Gender:</label>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other

    <label>Hobbies:</label>
    <input type="checkbox"> Football
    <input type="checkbox"> Music
    <input type="checkbox"> Coding
    <input type="checkbox"> Gaming

    <label>Course:</label>
    <select>
        <option>Select Course</option>
        <option>Information Technology</option>
        <option>Computer Science</option>
        <option>Software Engineering</option>
    </select>

    <label>Phone Number:</label>
    <input type="tel" placeholder="07XXXXXXXX">

    <label>Address:</label>
    <textarea rows="4" placeholder="Enter your address"></textarea>

    <label>Upload Photo:</label>
    <input type="file">

    <label>Website:</label>
    <input type="url" placeholder="https://example.com">

    <label>Preferred Time:</label>
    <input type="time">

    <label>Favourite Color:</label>
    <input type="color">

    <label>Computer Skill Level:</label>
    <input type="range" min="0" max="100">

    <br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">

</form>

</body>
      </html>
